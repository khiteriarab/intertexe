# Apply Material Intelligence tables and run the production release gate.
# Does not print API keys. Dispatch after production has this workflow on main.
name: Material API Release Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/material-api-release-gate.yml"
      - "scripts/live-material-api-gate.ts"
      - "lib/apply-material-intelligence-migration.ts"
      - "supabase/migrations/20260819_material_intelligence_api.sql"
      - "app/api/cron/apply-material-intelligence-migration/**"

concurrency:
  group: material-api-release-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Apply migration and run live checks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          HQ_PASSWORD: ${{ secrets.HQ_PASSWORD }}
          MATERIAL_API_SITE: https://www.intertexe.com
        run: node --import tsx scripts/live-material-api-gate.ts
