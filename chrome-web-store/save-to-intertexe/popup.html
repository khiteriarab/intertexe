<!DOCTYPE html>
<html lang="en">
  <head>

  <body>
    <div class="shell">
      <header>
        <div class="brand-row">
          <div>
            <p class="eyebrow">INTERTEXE</p>

      <p id="status" class="status" hidden></p>

        <section id="signedIn" class="hidden">

        </section>

        <section id="result" class="hidden"></section>

      <footer id="dock" class="dock hidden"></footer>

    <script src="popup.js"></script>
