<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save to INTERTEXE</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <p class="eyebrow">INTERTEXE</p>
      <h1>Save to INTERTEXE</h1>
      <p class="tagline">Know the material before you buy.</p>
    </header>

    <p id="status" class="status" hidden></p>

    <section id="signedOut" class="hidden">
      <p class="lede">Sign in so this page can be saved to your Inspirations — the same list as iOS.</p>
      <button id="signIn" type="button">Sign in to INTERTEXE</button>
    </section>

    <section id="signedIn" class="hidden">
      <button id="save" type="button">Save this page</button>
      <button id="signOut" type="button" class="ghost">Sign out</button>
    </section>

    <section id="result" class="hidden"></section>

    <script src="popup.js"></script>
  </body>
</html>
